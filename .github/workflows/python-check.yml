name: Python Security Lab Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m py_compile run_lab.py
          python -m py_compile src/attack_detector.py
          python -m py_compile src/logger.py
          python -m py_compile src/trust_engine.py
          python -m py_compile src/response_engine.py
          python -m py_compile src/pcap_analyzer.py

      - name: Run tests
        run: |
          pytest
